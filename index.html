<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V130 ULTRA</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
 --neon:#00F3FF;
 --purple:#BC00FF;
 --glass:rgba(10,10,25,0.85);
}

body{margin:0;background:#000;color:white;font-family:Segoe UI;overflow:hidden;}
#map{position:absolute;inset:0;z-index:1;}

.ui{position:fixed;z-index:999;}

/* BIG BANG */
#intro{
 position:fixed;inset:0;background:black;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;z-index:9999;cursor:pointer;
}
#logo{
 font-size:40px;color:#00F3FF;
 animation:pulse 2s infinite alternate;
}
@keyframes pulse{
 from{transform:scale(1)}
 to{transform:scale(1.2)}
}

/* WEATHER CARD */
.weather{
 background:linear-gradient(135deg,#00F3FF,#BC00FF);
 padding:12px;border-radius:20px;
 color:white;width:140px;
 box-shadow:0 0 20px rgba(0,243,255,0.5);
}

/* GLASS */
.glass{
 background:var(--glass);
 backdrop-filter:blur(25px);
 border-radius:20px;
}

/* BUTTON */
.btn{
 background:linear-gradient(135deg,#00F3FF,#BC00FF);
 padding:6px 12px;border-radius:20px;
}

.search{
 padding:8px;border-radius:20px;
 background:rgba(255,255,255,0.05);
 border:none;color:white;width:200px;
}
</style>

</head>

<body>

<!-- INTRO -->

<div id="intro" onclick="App.start()">
 <div id="logo">TIMEMAP</div>
 <p>Portalni ochish uchun bosing</p>
</div>

<div id="map"></div>

<!-- TOP -->

<div class="ui top-5 left-1/2 -translate-x-1/2 glass px-4 py-2 flex gap-3">
<input id="search" class="search" placeholder="AI qidiruv...">
<button onclick="App.aiSearch()" class="btn">AI</button>
<div>🪙 <span id="coin">100</span></div>
<button onclick="App.toggle()" class="btn">🛰</button>
</div>

<!-- WEATHER -->

<div class="ui top-16 right-3 weather text-xs">
<p id="temp">--°C</p>
<p id="desc">--</p>
</div>

<!-- AI -->

<div class="ui bottom-24 left-3 glass p-3 w-52">
<p class="text-cyan-400 text-xs">AI</p>
<p id="aiText">Tayyor...</p>
<button onclick="App.scan()" class="btn w-full mt-2">Scan</button>
</div>

<!-- YEAR -->

<div class="ui bottom-5 left-1/2 -translate-x-1/2 glass p-3">
<span id="yearLabel">2024</span>
<input type="range" min="1400" max="2100" value="2024"
oninput="App.time(this.value)">
</div>

<script>
let map, markers=[];
let coin=100, isSat=false;

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const places=[
 {type:"hotel",name:"Hotel",lat:41.31,lng:69.24},
 {type:"food",name:"Restoran",lat:41.312,lng:69.25}
];

const historyData=[
 {name:"Qadimiy joy",lat:41.313,lng:69.23,year:1800,story:"Bu yer tarixiy markaz"}
];

const App={

start(){
 document.getElementById("intro").style.display="none";
 this.speak("Xush kelibsiz. Biz bilan yangi dunyoni kashf qiling");
 this.init();
},

init(){
 map=L.map('map').setView([41.31,69.24],15);
 street.addTo(map);
 this.locate();
},

locate(){
 navigator.geolocation.getCurrentPosition(pos=>{
  let lat=pos.coords.latitude;
  let lng=pos.coords.longitude;

  map.setView([lat,lng],16);
  L.marker([lat,lng]).addTo(map);
  this.getWeather(lat,lng);
  this.showAll();
 });
},

async getWeather(lat,lng){
 let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
 let d=await r.json();
 document.getElementById("temp").innerText=d.current_weather.temperature+"°C";
 document.getElementById("desc").innerText="Live";
},

showAll(){
 this.clear();
 places.forEach(p=>{
  let m=L.marker([p.lat,p.lng]).addTo(map)
   .bindPopup(p.name);
  markers.push(m);
 });
},

aiSearch(){
 let q=document.getElementById("search").value.toLowerCase();

 if(q.includes("hotel")) this.filter("hotel");
 else if(q.includes("ovqat")) this.filter("food");
 else if(q.includes("tarix")) this.time(1800);

 this.speak("Natijalar chiqarildi");
},

filter(type){
 this.clear();
 places.forEach(p=>{
  if(p.type===type){
   let m=L.marker([p.lat,p.lng]).addTo(map);
   markers.push(m);
  }
 });
},

time(y){
 document.getElementById("yearLabel").innerText=y;
 this.clear();

 if(y<1900){
  document.body.style.filter="sepia(0.6)";
  historyData.forEach(p=>{
   let m=L.marker([p.lat,p.lng])
    .addTo(map)
    .on('click',()=>this.speak(p.story));
   markers.push(m);
  });
 } else document.body.style.filter="none";
},

toggle(){
 isSat=!isSat;
 if(isSat){map.removeLayer(street);sat.addTo(map);}
 else{map.removeLayer(sat);street.addTo(map);}
},

scan(){
 this.flash();
 this.addCoin(10);
 this.speak("Bonus berildi");
},

flash(){
 document.body.style.filter="brightness(1.5)";
 setTimeout(()=>document.body.style.filter="none",200);
},

addCoin(v){
 coin+=v;
 document.getElementById("coin").innerText=coin;
},

clear(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};
</script>

</body>
</html>
