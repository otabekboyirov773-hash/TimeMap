<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap Final</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;background:#020617;color:white;font-family:sans-serif}

/* SPLASH */
#splash{
 position:fixed; inset:0;
 display:flex; flex-direction:column;
 align-items:center; justify-content:center;
 background:black; z-index:999;
}
#logo{width:120px;cursor:pointer}
.boom{animation:boom 1s forwards}
@keyframes boom{100%{transform:scale(20);opacity:0}}

/* MAP */
#map{height:100vh}

/* HUD */
#hud{
 position:fixed; top:10px; left:10px;
 background:#000a; padding:10px;
 border-radius:10px; z-index:10;
}

/* RADAR */
#radar{
 position:fixed;
 bottom:20px; right:20px;
 width:120px; height:120px;
 border-radius:50%;
 border:2px solid cyan;
 animation:spin 3s linear infinite;
}
@keyframes spin{
 from{transform:rotate(0)}
 to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
 <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png" id="logo">
 <h2>TimeMap</h2>
</div>

<div id="app" style="display:none">
 <div id="hud">
   💰 <span id="coins">0</span><br>
   🏆 <span id="top">0</span><br>
   <button onclick="bonus()">🎁 Bonus</button>
   <button onclick="ai()">🤖 AI</button>
 </div>

 <div id="map"></div>
 <div id="radar"></div>
</div>

<script>
let coins = 0;
let map;
let userMarker;

// 📍 MARKET KOORDINATA (SEN BERGAN)
const MARKET = {
 lat:41.585697,
 lng:64.212129,
 name:"Eng Arzon Market 🛒"
};

// SPLASH → BING BANG
logo.onclick = ()=>{
 splash.classList.add("boom");

 setTimeout(()=>{
   splash.remove();
   app.style.display="block";
   startApp();
   speak("TimeMap ga xush kelibsiz");
 },800);
};

// START
function startApp(){
 map = L.map('map').setView([41.311,69.279], 6);

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

 // MARKET QO‘SHISH
 const marketMarker = L.marker([MARKET.lat,MARKET.lng]).addTo(map);
 marketMarker.bindPopup("🛒 Eng arzon oziq-ovqat do‘koni");

 // LOCATION
 navigator.geolocation.watchPosition(pos=>{
   const lat = pos.coords.latitude;
   const lng = pos.coords.longitude;

   if(userMarker) map.removeLayer(userMarker);

   userMarker = L.marker([lat,lng]).addTo(map);
   map.setView([lat,lng],15);

   spawnCoin(lat,lng);
   checkNearMarket(lat,lng);
 });
}

// COIN
function spawnCoin(lat,lng){
 const cLat = lat + (Math.random()-0.5)/200;
 const cLng = lng + (Math.random()-0.5)/200;

 const coin = L.circleMarker([cLat,cLng],{
   radius:8,color:"gold"
 }).addTo(map);

 coin.on("click",()=>{
   coins+=10;
   update();
   map.removeLayer(coin);
 });
}

// BONUS
function bonus(){
 coins+=50;
 update();
 alert("+50 coin 🎁");
}

// UPDATE
function update(){
 document.getElementById("coins").innerText = coins;
}

// MARKET YAQINMI → TOP
function checkNearMarket(lat,lng){
 const dist = Math.sqrt(
   (lat - MARKET.lat)**2 + (lng - MARKET.lng)**2
 );

 if(dist < 0.01){
   document.getElementById("top").innerText = "TOP 🔥";
 }
}

// AI OVOZ
function speak(text){
 const u = new SpeechSynthesisUtterance(text);
 u.lang="uz-UZ";
 u.rate=1;
 speechSynthesis.speak(u);
}

function ai(){
 speak("Eng arzon market shu yerda joylashgan");
}
</script>

</body>
</html>
