<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap ULTRA</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;background:black;color:white;overflow:hidden;font-family:Segoe UI;}
#map{position:absolute;inset:0;z-index:1;}

/* INTRO */
#intro{
 position:fixed;inset:0;
 background:black;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 z-index:9999;
 cursor:pointer;
}

canvas{
 position:absolute;
}

/* UI */
.glass{
 background:rgba(20,20,30,0.6);
 backdrop-filter:blur(30px);
 border-radius:20px;
 padding:10px;
}

.ui{position:fixed;z-index:999;}

.btn{
 background:linear-gradient(135deg,#00F3FF,#BC00FF);
 padding:6px 12px;
 border-radius:20px;
}
</style>

</head>

<body>

<div id="intro">
 <canvas id="earth"></canvas>
 <p style="margin-top:200px;">Bosish → yangi dunyo</p>
</div>

<div id="map"></div>

<!-- TOP -->

<div class="ui top-5 left-1/2 -translate-x-1/2 glass flex gap-3">
<div>🪙 <span id="coin">100</span></div>
<button onclick="App.toggle()" class="btn">🛰</button>
</div>

<script>
let canvas=document.getElementById("earth");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

// EARTH DRAW
function drawEarth(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.beginPath();
 ctx.arc(canvas.width/2,canvas.height/2,100,0,Math.PI*2);
 ctx.fillStyle="#00F3FF";
 ctx.fill();
}

// PARTICLES
function explode(){
 particles=[];
 for(let i=0;i<200;i++){
  particles.push({
   x:canvas.width/2,
   y:canvas.height/2,
   vx:(Math.random()-0.5)*10,
   vy:(Math.random()-0.5)*10
  });
 }
}

function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach(p=>{
  p.x+=p.vx;
  p.y+=p.vy;
  ctx.fillRect(p.x,p.y,3,3);
 });
 requestAnimationFrame(animate);
}

function gather(){
 particles.forEach(p=>{
  p.vx+=(canvas.width/2-p.x)/100;
  p.vy+=(canvas.height/2-p.y)/100;
 });
}

// CLICK
document.getElementById("intro").onclick=()=>{
 explode();
 animate();

 setTimeout(()=>{
  gather();
 },800);

 setTimeout(()=>{
  document.getElementById("intro").style.opacity=0;
  setTimeout(()=>document.getElementById("intro").remove(),500);
  App.init();
  App.speak("Xush kelibsiz. Yangi dunyoni kashf qiling");
 },2000);
};

// MAP
let map,isSat=false;
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const App={

init(){
 map=L.map('map').setView([41.31,69.24],15);
 street.addTo(map);
},

toggle(){
 isSat=!isSat;
 if(isSat){map.removeLayer(street);sat.addTo(map);}
 else{map.removeLayer(sat);street.addTo(map);}
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};

// INITIAL
drawEarth();
</script>

</body>
</html>
