<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V20</title>

<style>
body{
 margin:0;
 font-family:sans-serif;
 background:#020617;
 color:#fff;
}

.container{
 display:flex;
 height:100vh;
}

/* LEFT PANEL */
.left{
 width:300px;
 background:#0b1220;
 padding:20px;
}

.card{
 background:#111827;
 padding:15px;
 border-radius:10px;
 margin-bottom:15px;
}

button{
 padding:10px;
 border:none;
 border-radius:8px;
 background:#00d4ff;
 color:#000;
 cursor:pointer;
}

/* MAP */
.map{
 flex:1;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
}

/* PLAYER */
.player{
 width:15px;
 height:15px;
 background:#00d4ff;
 border-radius:50%;
}

/* HIDDEN COIN */
.hidden{
 width:20px;
 height:20px;
 background:gold;
 border-radius:50%;
 position:absolute;
 cursor:pointer;
}

/* RIGHT */
.right{
 width:250px;
 background:#0b1220;
 padding:15px;
}

.chat{
 height:200px;
 overflow:auto;
 background:#111827;
 padding:10px;
 border-radius:10px;
}

/* BIG BANG */
#bang{
 position:fixed;
 inset:0;
 background:black;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 z-index:999;
 animation:fade 2s forwards;
}

@keyframes fade{
 0%{opacity:1}
 100%{opacity:0;display:none}
}
</style>
</head>

<body>

<div id="bang">💥 TimeMap</div>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="card">
<h3>KUNLIK BONUS</h3>
<button onclick="dailyBonus()">BONUS OLISH</button>
<p id="bonusStatus"></p>
</div>

<div class="card">
<h3>YASHIRINGAN COIN</h3>
<button onclick="findCoin()">IZLASH</button>
</div>

<div class="card">
<h3>BALANS</h3>
<p id="coins">0</p>
</div>

</div>

<!-- MAP -->
<div class="map" id="map">
<div class="player"></div>
</div>

<!-- RIGHT -->
<div class="right">

<h3>AI CHAT</h3>
<div class="chat" id="chat"></div>
<input id="input" placeholder="Savol yoz...">
<button onclick="send()">Send</button>

<h3>LEADERBOARD</h3>
<div id="top"></div>

</div>

</div>

<script>

// ================= DATA =================
let coins = localStorage.getItem("coins") || 0;
coins = parseInt(coins);

let lastBonus = localStorage.getItem("bonus");

// ================= UI =================
function update(){
 document.getElementById("coins").innerText = coins;
 localStorage.setItem("coins", coins);
 updateTop();
}

// ================= DAILY BONUS =================
function dailyBonus(){
 let today = new Date().toDateString();

 if(lastBonus === today){
   document.getElementById("bonusStatus").innerText="Bugun oldingiz ❌";
   return;
 }

 coins += 100;
 lastBonus = today;

 localStorage.setItem("bonus", today);
 update();

 document.getElementById("bonusStatus").innerText="+100 coin 🎁";
}

// ================= HIDDEN COIN =================
function findCoin(){
 const coin = document.createElement("div");
 coin.className="hidden";

 coin.style.top = Math.random()*80 + "%";
 coin.style.left = Math.random()*80 + "%";

 coin.onclick=()=>{
   coins += 300;
   update();
   coin.remove();
   alert("🎯 Yashirin coin topildi!");
 };

 document.getElementById("map").appendChild(coin);
}

// ================= AI =================
function aiReply(text){
 text=text.toLowerCase();

 if(text.includes("salom")) return "Salom 👋";
 if(text.includes("bonus")) return "Har kuni 1 marta bonus bor 🎁";
 if(text.includes("coin")) return "Xaritada yashirin coin top!";
 return "Qiziqarli savol 😄";
}

function send(){
 const val = document.getElementById("input").value;

 addChat("👤 "+val);
 const r = aiReply(val);
 addChat("🤖 "+r);

 speechSynthesis.speak(new SpeechSynthesisUtterance(r));

 document.getElementById("input").value="";
}

function addChat(t){
 let d = document.createElement("div");
 d.innerText=t;
 document.getElementById("chat").appendChild(d);
}

// ================= LEADERBOARD =================
function updateTop(){
 let arr = JSON.parse(localStorage.getItem("top")||"[]");

 arr.push(coins);
 arr.sort((a,b)=>b-a);
 arr=arr.slice(0,5);

 localStorage.setItem("top", JSON.stringify(arr));

 let html="";
 arr.forEach(i=> html+="<div>"+i+"</div>");

 document.getElementById("top").innerHTML=html;
}

// ================= START =================
update();

</script>

</body>
</html>
