<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V100 ULTRA</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
 --neon:#00F3FF;
 --purple:#BC00FF;
 --glass:rgba(10,10,25,0.7);
}
body{
 margin:0;
 background:#000;
 color:white;
 font-family:Segoe UI;
}
#map{
 position:absolute;
 inset:0;
}

/* GLASS */
.glass{
 background:var(--glass);
 backdrop-filter:blur(25px);
 border:1px solid rgba(0,243,255,0.2);
 border-radius:25px;
 box-shadow:0 0 40px rgba(0,0,0,0.8);
}

/* BUTTON */
.btn{
 background:linear-gradient(135deg,var(--neon),var(--purple));
 padding:8px 14px;
 border-radius:30px;
 font-size:11px;
 font-weight:bold;
 letter-spacing:1px;
 box-shadow:0 0 20px rgba(0,243,255,0.4);
 transition:0.3s;
}
.btn:hover{
 transform:scale(1.1);
 box-shadow:0 0 40px var(--neon);
}

/* SEARCH */
.search{
 width:300px;
 background:rgba(255,255,255,0.05);
 border-radius:50px;
 padding:10px 20px;
 outline:none;
 border:1px solid rgba(255,255,255,0.1);
}

/* CATEGORY */
.cat{
 display:flex;
 gap:10px;
}
.cat div{
 padding:10px;
 border-radius:15px;
 background:rgba(255,255,255,0.05);
 text-align:center;
 cursor:pointer;
}
</style>

</head>

<body>

<div id="map"></div>

<!-- TOP BAR -->

<div class="fixed top-5 left-1/2 -translate-x-1/2 glass px-6 py-3 flex gap-4 z-50">
<input class="search" placeholder="Qidir...">
<div>🪙 <span id="coin">100</span></div>
<div>👤 User</div>
</div>

<!-- AI PANEL -->

<div class="fixed top-20 left-5 glass p-4 w-60 z-50">
<p class="text-cyan-400 text-xs">AI V100</p>
<p id="aiText" class="text-xs opacity-70">Tizim ishlayapti...</p>
<button onclick="App.scan()" class="btn mt-2 w-full">Scan</button>
</div>

<!-- CATEGORY -->

<div class="fixed bottom-24 left-1/2 -translate-x-1/2 glass p-3 cat z-50">
<div onclick="App.filter('hotel')">🏨<br>Hotel</div>
<div onclick="App.filter('food')">🍔<br>Food</div>
<div onclick="App.filter('history')">🏛<br>History</div>
<div onclick="App.showAll()">🌍<br>All</div>
</div>

<!-- CONTROL -->

<div class="fixed bottom-10 left-1/2 -translate-x-1/2 glass p-3 flex gap-2 z-50">
<button onclick="App.toggle()" class="btn">MAP</button>
<input type="range" min="1400" max="2100" value="2024"
oninput="App.time(this.value)">
</div>

<script>
let map, markers=[];
let userLat, userLng;
let coin=100;
let isSat=false;

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const places=[
 {type:"hotel",name:"Hotel Premium",lat:41.31,lng:69.24,year:2024,reward:20},
 {type:"food",name:"Restaurant Top",lat:41.312,lng:69.25,year:2024,reward:15},
 {type:"history",name:"Qadimiy joy",lat:41.313,lng:69.23,year:1800,reward:30}
];

const App={

init(){
 map=L.map('map').setView([41.31,69.24],15);
 street.addTo(map);
 this.locate();
 this.updateCoin();
},

locate(){
 navigator.geolocation.getCurrentPosition(pos=>{
  userLat=pos.coords.latitude;
  userLng=pos.coords.longitude;

  map.setView([userLat,userLng],16);

  L.marker([userLat,userLng])
   .addTo(map)
   .bindPopup("Siz shu yerdasiz");

  L.circle([userLat,userLng],{radius:3000,color:'#00F3FF'}).addTo(map);

  this.showAll();
 });
},

clear(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
},

showAll(){
 this.clear();
 places.forEach(p=>{
  let m=L.marker([p.lat,p.lng])
   .addTo(map)
   .bindPopup(p.name+" +"+p.reward+" coin")
   .on('click',()=>this.addCoin(p.reward));
  markers.push(m);
 });
},

filter(type){
 this.clear();
 places.forEach(p=>{
  if(p.type===type){
   let m=L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup(p.name)
    .on('click',()=>this.addCoin(p.reward));
   markers.push(m);
  }
 });
},

time(y){
 this.clear();
 places.forEach(p=>{
  if(p.year<=y){
   let m=L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup(p.name+" ("+p.year+")")
    .on('click',()=>this.addCoin(p.reward));
   markers.push(m);
  }
 });
},

toggle(){
 isSat=!isSat;
 if(isSat){
  map.removeLayer(street);
  sat.addTo(map);
 } else {
  map.removeLayer(sat);
  street.addTo(map);
 }
},

scan(){
 this.speak("Scan qilindi bonus berildi");
 this.addCoin(10);
},

addCoin(v){
 coin+=v;
 this.updateCoin();
},

updateCoin(){
 document.getElementById("coin").innerText=coin;
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};

App.init();
</script>

</body>
</html>
