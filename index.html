<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeMap ULTRA V23 | Enterprise</title>
    
    <!-- 📦 KUTUBXONALAR (CORB xatosini oldini olish uchun standart linklar) -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <!-- 🎨 O'ZINGIZNING CSS (Muhim: ./ qo'shildi) -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-black text-white overflow-hidden h-screen w-screen relative">

    <!-- 🌌 BIG BANG INTRO (Logotip kichraytirildi) -->
    <div id="portal-intro" onclick="App.start()" class="fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center cursor-pointer">
        <canvas id="big-bang-canvas" class="absolute inset-0"></canvas>
        <!-- Logotip o'lchami w-48 (192px) qilib belgilandi -->
        <img src="./assets/logo.png" id="main-logo" class="w-48 z-10 animate-pulse drop-shadow-[0_0_30px_rgba(255,215,0,0.5)]" alt="TimeMap Logo">
        <p class="mt-8 tracking-[8px] text-[10px] text-yellow-500 opacity-60 z-10 uppercase">Portalni portlatish uchun bosing</p>
    </div>

    <!-- 🗺 XARITA -->
    <div id="map" class="h-full w-full absolute inset-0 z-0"></div>

    <!-- 💰 WALLET HUD -->
    <div class="fixed top-6 right-6 z-50 glass px-6 py-2 rounded-2xl flex items-center gap-4 border border-yellow-500/20 shadow-2xl">
        <div class="text-right">
            <p class="text-[8px] opacity-50 uppercase">Hamyon</p>
            <b class="text-lg text-yellow-500" id="ui-balance">500.00</b>
        </div>
        <div class="text-2xl animate-bounce">🪙</div>
    </div>

    <!-- 🧩 SKRIPTLAR -->
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
