<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeMap V15 Game</title>

<style>
body{margin:0;background:#020617;color:white;font-family:sans-serif;overflow:hidden}

#map{
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
 position:relative;
}

.coin{
 position:absolute;
 font-size:22px;
 cursor:pointer;
 animation:pop 0.3s ease;
}

@keyframes pop{
 from{transform:scale(0)}
 to{transform:scale(1)}
}

#hud{
 position:fixed;
 top:10px;
 left:10px;
 background:#000a;
 padding:10px;
 border-radius:10px;
}

#leaderboard{
 position:fixed;
 top:10px;
 right:10px;
 background:#000a;
 padding:10px;
 border-radius:10px;
 max-width:150px;
 font-size:12px;
}

#chat{
 position:fixed;
 bottom:0;
 width:100%;
 display:flex;
}

#chat input{
 flex:1;
 padding:10px;
 border:none;
}

#chat button{
 padding:10px;
 background:cyan;
 border:none;
}

#messages{
 position:fixed;
 bottom:50px;
 width:100%;
 max-height:200px;
 overflow:auto;
 font-size:12px;
}

#splash{
 position:fixed;
 inset:0;
 background:black;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 z-index:999;
}
</style>

</head>

<body>

<div id="splash">💥 TimeMap Loading...</div>

<div id="hud">
💰 <span id="coins">0</span>
</div>

<div id="leaderboard">
🏆 TOP
<div id="top"></div>
</div>

<div id="map"></div>

<div id="messages"></div>

<div id="chat">
<input id="input" placeholder="AI bilan gaplash...">
<button onclick="send()">Send</button>
</div>

<script>

// ================= USER =================
let coins = localStorage.getItem("coins") || 0;
coins = parseInt(coins);

// ================= UI =================
function updateCoins(){
 document.getElementById("coins").innerText = coins;
 localStorage.setItem("coins", coins);
}

// ================= GAME =================
function spawnCoin(){
 const el = document.createElement("div");
 el.className="coin";
 el.innerText="🪙";

 const x = Math.random()*window.innerWidth;
 const y = Math.random()*window.innerHeight;

 el.style.left=x+"px";
 el.style.top=y+"px";

 el.onclick=()=>{
   coins += Math.floor(Math.random()*50)+10;
   updateCoins();
   el.remove();
   updateLeaderboard();
 };

 document.getElementById("map").appendChild(el);

 setTimeout(()=>el.remove(),5000);
}

// spawn loop
setInterval(spawnCoin,1500);

// ================= LEADERBOARD =================
function updateLeaderboard(){
 let list = JSON.parse(localStorage.getItem("top")||"[]");

 list.push(coins);
 list.sort((a,b)=>b-a);
 list = list.slice(0,5);

 localStorage.setItem("top", JSON.stringify(list));

 let html="";
 list.forEach(i=> html+="<div>"+i+"</div>");
 document.getElementById("top").innerHTML=html;
}

// ================= AI =================
function aiReply(text){
 text = text.toLowerCase();

 if(text.includes("salom")) return "Salom 👋";
 if(text.includes("coin")) return "Coin yig‘ishda davom et 💰";
 if(text.includes("kim")) return "Men TimeMap AI 🤖";
 if(text.includes("help")) return "Coin bos va yig‘!";
 return "Qiziqarli savol 😄";
}

function send(){
 const val = document.getElementById("input").value;

 addMsg("👤 "+val);
 const reply = aiReply(val);
 addMsg("🤖 "+reply);

 speechSynthesis.speak(new SpeechSynthesisUtterance(reply));

 document.getElementById("input").value="";
}

function addMsg(t){
 const el = document.createElement("div");
 el.innerText = t;
 document.getElementById("messages").appendChild(el);
}

// ================= START =================
updateCoins();
updateLeaderboard();

setTimeout(()=>{
 document.getElementById("splash").style.display="none";
 document.getElementById("map").innerHTML="🗺 Coin Game Boshladi!";
},1500);

</script>

</body>
</html>
