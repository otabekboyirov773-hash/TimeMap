<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V150 PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;background:#000;color:white;font-family:Segoe UI;overflow:hidden;}
#map{position:absolute;inset:0;z-index:1;}

.glass{
 background:rgba(20,20,30,0.6);
 backdrop-filter:blur(40px);
 border-radius:20px;
 border:1px solid rgba(255,255,255,0.08);
}

.ui{position:fixed;z-index:999;}

.btn{
 background:linear-gradient(135deg,#00F3FF,#BC00FF);
 padding:6px 12px;border-radius:20px;
}

.search{
 padding:8px;border-radius:20px;
 background:rgba(255,255,255,0.05);
 border:none;color:white;width:200px;
}

#intro{
 position:fixed;inset:0;background:black;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;z-index:9999;cursor:pointer;
}
</style>

</head>

<body>

<div id="intro" onclick="App.start()">
<h1 style="font-size:40px;color:#00F3FF;">TIMEMAP</h1>
<p>Portalni ochish uchun bosing</p>
</div>

<div id="map"></div>

<!-- TOP -->

<div class="ui top-5 left-1/2 -translate-x-1/2 glass px-4 py-2 flex gap-3">
<input id="search" class="search" placeholder="Joy nomini yoz...">
<button onclick="App.searchPlace()" class="btn">AI</button>
<div>🪙 <span id="coin">100</span></div>
<button onclick="App.toggle()" class="btn">🛰</button>
</div>

<!-- AI PANEL -->

<div class="ui bottom-24 left-3 glass p-3 w-64">
<p class="text-cyan-400 text-xs">AI Assistant</p>
<p id="aiText">Joy tanlang...</p>
</div>

<script>

let map,marker;
let isSat=false;

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const App={

start(){
 document.getElementById("intro").style.display="none";
 this.speak("Xush kelibsiz. Biz bilan yangi dunyoni kashf qiling");
 this.init();
},

init(){
 map=L.map('map').setView([41.31,69.24],13);
 street.addTo(map);
},

// 🔍 AI SEARCH
async searchPlace(){
 let q=document.getElementById("search").value;

 // OpenStreetMap search
 let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
 let data=await res.json();

 if(data.length===0){
  this.updateAI("Topilmadi");
  return;
 }

 let lat=data[0].lat;
 let lon=data[0].lon;

 map.flyTo([lat,lon],16);

 if(marker) map.removeLayer(marker);
 marker=L.marker([lat,lon]).addTo(map);

 // Wikipedia info
 let wiki=await fetch(`https://uz.wikipedia.org/api/rest_v1/page/summary/${q}`);
 let wdata=await wiki.json();

 let info=wdata.extract || "Ma'lumot topilmadi";

 this.updateAI(info);
 this.speak(info.slice(0,150));
},

updateAI(t){
 document.getElementById("aiText").innerText=t;
},

toggle(){
 isSat=!isSat;
 if(isSat){map.removeLayer(street);sat.addTo(map);}
 else{map.removeLayer(sat);street.addTo(map);}
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};

</script>

</body>
</html>
