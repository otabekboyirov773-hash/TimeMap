<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap Real Map</title>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;background:#020617;color:#fff;font-family:sans-serif}
#map{height:100vh}
#panel{
 position:fixed;
 top:10px;
 left:10px;
 background:#000a;
 padding:10px;
 border-radius:10px;
 z-index:1000;
}
button{
 padding:8px;
 border:none;
 border-radius:6px;
 background:cyan;
 cursor:pointer;
}
</style>
</head>

<body>

<div id="panel">
💰 <span id="coins">0</span><br><br>
<button onclick="dailyBonus()">🎁 Bonus</button>
<button onclick="spawnCoin()">🪙 Coin</button>
</div>

<div id="map"></div>

<script>

// ================= COINS =================
let coins = localStorage.getItem("coins") || 0;
coins = parseInt(coins);

function update(){
 document.getElementById("coins").innerText = coins;
 localStorage.setItem("coins", coins);
}

// ================= MAP =================
const map = L.map('map').setView([41.311,69.279], 13);

// OpenStreetMap layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom: 19
}).addTo(map);

// ================= PLAYER =================
let player = L.marker([41.311,69.279]).addTo(map);

// GEO LOCATION
if(navigator.geolocation){
 navigator.geolocation.watchPosition(pos=>{
   let lat = pos.coords.latitude;
   let lng = pos.coords.longitude;

   player.setLatLng([lat,lng]);
   map.setView([lat,lng]);
 });
}

// ================= BONUS =================
let lastBonus = localStorage.getItem("bonus");

function dailyBonus(){
 let today = new Date().toDateString();

 if(lastBonus === today){
   alert("Bugun oldingiz ❌");
   return;
 }

 coins += 100;
 lastBonus = today;

 localStorage.setItem("bonus", today);
 update();

 alert("+100 coin 🎁");
}

// ================= HIDDEN COIN =================
function spawnCoin(){
 let lat = 41.311 + (Math.random()-0.5)/100;
 let lng = 69.279 + (Math.random()-0.5)/100;

 let coin = L.circle([lat,lng],{
   radius:20,
   color:"gold"
 }).addTo(map);

 coin.on("click",()=>{
   coins += 200;
   update();
   map.removeLayer(coin);
   alert("🎯 Coin topildi!");
 });
}

// ================= START =================
update();

</script>

</body>
</html>
