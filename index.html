<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V110 ULTRA</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
 --neon:#00F3FF;
 --purple:#BC00FF;
 --glass:rgba(10,10,25,0.85);
}

body{margin:0;background:#000;color:white;font-family:Segoe UI;}
#map{position:absolute;inset:0;z-index:1;}

.ui{position:fixed;z-index:999;}

.glass{
 background:var(--glass);
 backdrop-filter:blur(25px);
 border:1px solid rgba(0,243,255,0.2);
 border-radius:20px;
}

.btn{
 background:linear-gradient(135deg,var(--neon),var(--purple));
 padding:6px 12px;
 border-radius:20px;
 font-size:11px;
}

.search{
 width:200px;
 padding:6px;
 border-radius:20px;
 background:rgba(255,255,255,0.05);
 border:none;
 color:white;
}
</style>

</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="ui top-5 left-1/2 -translate-x-1/2 glass px-4 py-2 flex gap-3">
<input class="search" placeholder="Qidir...">
<div>🪙 <span id="coin">100</span></div>
<button onclick="App.toggle()" class="btn">🛰</button>
</div>

<!-- WEATHER -->

<div class="ui top-16 right-3 glass p-3 text-xs">
<p>🌦</p>
<p id="temp">--</p>
<p id="desc">--</p>
</div>

<!-- AI -->

<div class="ui bottom-24 left-3 glass p-3 w-52">
<p class="text-cyan-400 text-xs">AI</p>
<p id="aiText" class="text-xs">Tayyor...</p>
<button onclick="App.scan()" class="btn mt-2 w-full">Scan</button>
</div>

<!-- YEAR -->

<div class="ui bottom-5 left-1/2 -translate-x-1/2 glass p-3 flex gap-2 items-center">
<span id="yearLabel">2024</span>
<input type="range" min="1400" max="2100" value="2024"
oninput="App.time(this.value)">
</div>

<script>
let map, markers=[];
let coin=100;
let isSat=false;

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

// TARIX DATA
const historyData=[
 {name:"Qadimiy Bozor",lat:41.31,lng:69.24,year:1800,story:"Bu yer qadimiy savdo markazi bo‘lgan"},
 {name:"Qal'a",lat:41.312,lng:69.23,year:1500,story:"Bu yer himoya qal’asi edi"}
];

const App={

init(){
 map=L.map('map').setView([41.31,69.24],15);
 street.addTo(map);
 this.locate();
},

locate(){
 navigator.geolocation.getCurrentPosition(pos=>{
  let lat=pos.coords.latitude;
  let lng=pos.coords.longitude;

  map.setView([lat,lng],16);

  L.marker([lat,lng]).addTo(map).bindPopup("Siz shu yerdasiz");
  L.circle([lat,lng],{radius:3000,color:'#00F3FF'}).addTo(map);

  this.getWeather(lat,lng);
  this.showCurrent();
 });
},

// WEATHER
async getWeather(lat,lng){
 let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
 let data=await res.json();
 document.getElementById("temp").innerText=data.current_weather.temperature+"°C";
 document.getElementById("desc").innerText="Live";
},

clear(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
},

showCurrent(){
 this.clear();
},

time(y){
 document.getElementById("yearLabel").innerText=y;
 this.clear();

 if(y<1900){
  document.body.style.filter="sepia(0.6)";
  historyData.forEach(p=>{
   if(p.year<=y){
    let m=L.marker([p.lat,p.lng])
     .addTo(map)
     .bindPopup(p.name)
     .on('click',()=>this.speak(p.story));
    markers.push(m);
   }
  });
 } else {
  document.body.style.filter="none";
 }
},

toggle(){
 isSat=!isSat;
 if(isSat){
  map.removeLayer(street);
  sat.addTo(map);
 } else {
  map.removeLayer(sat);
  street.addTo(map);
 }
},

scan(){
 this.addCoin(10);
 this.speak("Yangi tarixiy joylar topildi");
},

addCoin(v){
 coin+=v;
 document.getElementById("coin").innerText=coin;
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};

App.init();
</script>

</body>
</html>
