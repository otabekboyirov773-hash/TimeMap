<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V26 WOW</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;background:black;color:white;overflow:hidden;font-family:sans-serif}

/* MAP */
#map{height:100vh;width:100%;transform:perspective(1000px) rotateX(5deg)}

/* INTRO */
#intro{
position:fixed;inset:0;background:black;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
z-index:999;cursor:pointer;
overflow:hidden;
}

#logo{
width:140px;
filter:drop-shadow(0 0 20px gold);
animation:pulse 2s infinite;
}
@keyframes pulse{50%{transform:scale(1.1)}}

/* PARTICLES */
.particle{
position:absolute;
width:4px;height:4px;
background:gold;
border-radius:50%;
}

/* GLASS UI */
.glass{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 30px rgba(0,255,255,0.2);
}

/* COIN */
.coin{
width:18px;height:18px;
border-radius:50%;
background:gold;
box-shadow:0 0 15px gold;
}

/* RADAR */
@keyframes radar{
from{transform:scale(0.5);opacity:1}
to{transform:scale(1.5);opacity:0}
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" onclick="bigBang()">
<img id="logo" src="https://cdn-icons-png.flaticon.com/512/854/854878.png">
<p class="mt-6 text-yellow-400 tracking-widest text-xs">PORTALNI BOSING</p>
</div>

<div id="map"></div>

<!-- HUD -->
<div class="fixed top-4 left-4 glass p-4 rounded-xl text-sm">
💰 <span id="coins">0</span><br>
💵 <span id="money">0</span><br>
</div>

<!-- AI -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs">
🤖 <span id="ai">Tayyor...</span>
</div>

<script>
let map, coins=0, money=0;

// 💥 BIG BANG
function bigBang(){
 const intro=document.getElementById("intro");

 for(let i=0;i<120;i++){
   let p=document.createElement("div");
   p.className="particle";
   p.style.left="50%";
   p.style.top="50%";

   document.body.appendChild(p);

   let angle=Math.random()*360;
   let dist=Math.random()*500;

   setTimeout(()=>{
     p.style.transform=`translate(
       ${Math.cos(angle)*dist}px,
       ${Math.sin(angle)*dist}px
     ) scale(2)`;
     p.style.opacity=0;
     p.style.transition="1s";
   },10);

   setTimeout(()=>p.remove(),1000);
 }

 intro.style.opacity=0;
 setTimeout(()=>{
   intro.remove();
   startApp();
 },800);
}

// 🚀 START
function startApp(){
 initMap();
 speak("TimeMap ga xush kelibsiz");
}

// 🗺 MAP
function initMap(){
 map=L.map('map').setView([41.31,69.27],13);

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
 .addTo(map);

 navigator.geolocation.watchPosition(pos=>{
   let lat=pos.coords.latitude;
   let lng=pos.coords.longitude;

   L.marker([lat,lng]).addTo(map);
   map.setView([lat,lng],15);

   spawnCoin(lat,lng);
   radar(lat,lng);
 });
}

// 🪙 COIN
function spawnCoin(lat,lng){
 let c=L.marker([
   lat+(Math.random()-0.5)/200,
   lng+(Math.random()-0.5)/200
 ],{icon:L.divIcon({className:"coin"})}).addTo(map);

 c.on("click",()=>{
   coins+=10;
   if(coins>=100){
     money+=100;
     coins=0;
   }
   update();
   speak("Coin olindi");
   map.removeLayer(c);
 });
}

// 📡 RADAR
function radar(lat,lng){
 let r=L.circle([lat,lng],{
   radius:100,color:"cyan"
 }).addTo(map);

 setTimeout(()=>map.removeLayer(r),1500);
}

// 🤖 AI
function speak(t){
 document.getElementById("ai").innerText=t;
 let u=new SpeechSynthesisUtterance(t);
 u.lang="uz-UZ";
 speechSynthesis.speak(u);
}

// UI
function update(){
 document.getElementById("coins").innerText=coins;
 document.getElementById("money").innerText=money;
}
</script>

</body>
</html>
