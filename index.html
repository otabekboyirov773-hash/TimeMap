<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V100 ULTRA FIX</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
 --neon:#00F3FF;
 --purple:#BC00FF;
 --glass:rgba(10,10,25,0.85);
}

body{
 margin:0;
 background:#000;
 color:white;
 font-family:Segoe UI;
}

#map{
 position:absolute;
 inset:0;
 z-index:1;
}

/* UI layer */
.ui{
 position:fixed;
 z-index:999;
}

/* GLASS */
.glass{
 background:var(--glass);
 backdrop-filter:blur(25px);
 border:1px solid rgba(0,243,255,0.2);
 border-radius:20px;
}

/* BUTTON */
.btn{
 background:linear-gradient(135deg,var(--neon),var(--purple));
 padding:8px 14px;
 border-radius:20px;
 font-size:12px;
}

/* SEARCH */
.search{
 width:220px;
 background:rgba(255,255,255,0.05);
 border-radius:50px;
 padding:8px 15px;
 border:none;
 color:white;
 outline:none;
}

/* CATEGORY */
.cat div{
 padding:8px;
 border-radius:12px;
 background:rgba(255,255,255,0.05);
 text-align:center;
 font-size:11px;
 cursor:pointer;
}
</style>

</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="ui top-3 left-1/2 -translate-x-1/2 glass px-4 py-2 flex gap-3 items-center">
<input class="search" placeholder="Qidir...">
<div>🪙 <span id="coin">100</span></div>
</div>

<!-- AI -->

<div class="ui top-16 left-3 glass p-3 w-52">
<p class="text-cyan-400 text-xs">AI</p>
<p id="aiText" class="text-xs">Tizim ishlayapti...</p>
<button onclick="App.scan()" class="btn mt-2 w-full">Scan</button>
</div>

<!-- CATEGORY -->

<div class="ui bottom-20 left-1/2 -translate-x-1/2 glass p-2 flex gap-2">
<div onclick="App.filter('hotel')">🏨</div>
<div onclick="App.filter('food')">🍔</div>
<div onclick="App.filter('history')">🏛</div>
<div onclick="App.showAll()">🌍</div>
</div>

<!-- CONTROL -->

<div class="ui bottom-5 left-1/2 -translate-x-1/2 glass p-2 flex gap-2">
<button onclick="App.toggle()" class="btn">MAP</button>
<input type="range" min="1400" max="2100" value="2024"
oninput="App.time(this.value)">
</div>

<script>
let map, markers=[];
let coin=100;
let isSat=false;

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const places=[
 {type:"hotel",name:"Hotel",lat:41.31,lng:69.24,year:2024,reward:20},
 {type:"food",name:"Food",lat:41.312,lng:69.25,year:2024,reward:15},
 {type:"history",name:"History",lat:41.313,lng:69.23,year:1800,reward:30}
];

const App={

init(){
 map=L.map('map').setView([41.31,69.24],15);
 street.addTo(map);
 this.locate();
 this.updateCoin();
},

locate(){
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;

  map.setView([lat,lng],16);

  L.marker([lat,lng]).addTo(map)
   .bindPopup("Siz shu yerdasiz");

  L.circle([lat,lng],{radius:3000,color:'#00F3FF'}).addTo(map);

  this.showAll();
 });
},

clear(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
},

showAll(){
 this.clear();
 places.forEach(p=>{
  let m=L.marker([p.lat,p.lng])
   .addTo(map)
   .bindPopup(p.name+" +"+p.reward)
   .on('click',()=>this.addCoin(p.reward));
  markers.push(m);
 });
},

filter(type){
 this.clear();
 places.forEach(p=>{
  if(p.type===type){
   let m=L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup(p.name)
    .on('click',()=>this.addCoin(p.reward));
   markers.push(m);
  }
 });
},

time(y){
 this.clear();
 places.forEach(p=>{
  if(p.year<=y){
   let m=L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup(p.name+" "+p.year)
    .on('click',()=>this.addCoin(p.reward));
   markers.push(m);
  }
 });
},

toggle(){
 isSat=!isSat;
 if(isSat){
  map.removeLayer(street);
  sat.addTo(map);
 } else {
  map.removeLayer(sat);
  street.addTo(map);
 }
},

scan(){
 this.addCoin(10);
 this.speak("Bonus berildi");
},

addCoin(v){
 coin+=v;
 this.updateCoin();
},

updateCoin(){
 document.getElementById("coin").innerText=coin;
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};

App.init();
</script>

</body>
</html>
