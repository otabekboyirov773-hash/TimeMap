<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeMap V100 NEXT LEVEL</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
 --neon:#00F3FF;
 --purple:#BC00FF;
 --glass:rgba(10,10,25,0.85);
}

body{margin:0;background:#000;color:white;font-family:Segoe UI;}
#map{position:absolute;inset:0;z-index:1;}

.ui{position:fixed;z-index:999;}

.glass{
 background:var(--glass);
 backdrop-filter:blur(25px);
 border:1px solid rgba(0,243,255,0.2);
 border-radius:20px;
}

.btn{
 background:linear-gradient(135deg,var(--neon),var(--purple));
 padding:6px 12px;
 border-radius:20px;
 font-size:11px;
}

.sidebar{
 width:70px;
 display:flex;
 flex-direction:column;
 gap:15px;
 align-items:center;
 padding:10px;
}

.sidebar div{
 cursor:pointer;
 font-size:18px;
}

.search{
 width:220px;
 padding:8px;
 border-radius:20px;
 background:rgba(255,255,255,0.05);
 border:none;
 color:white;
}
</style>

</head>

<body>

<div id="map"></div>

<!-- SIDEBAR -->

<div class="ui top-5 left-3 glass sidebar">
<div onclick="App.filter('hotel')">🏨</div>
<div onclick="App.filter('food')">🍔</div>
<div onclick="App.filter('history')">🏛</div>
<div onclick="App.showAll()">🌍</div>
</div>

<!-- TOP BAR -->

<div class="ui top-5 left-1/2 -translate-x-1/2 glass px-4 py-2 flex gap-3 items-center">
<input class="search" placeholder="Qidir...">
<div>🪙 <span id="coin">100</span></div>
</div>

<!-- WEATHER -->

<div class="ui top-16 right-3 glass p-3 w-40 text-xs">
<p>🌦 Ob-havo</p>
<p id="temp">--°C</p>
<p id="wind">-- km/h</p>
<p id="desc">--</p>
</div>

<!-- AI -->

<div class="ui bottom-24 left-3 glass p-3 w-52">
<p class="text-cyan-400 text-xs">AI</p>
<p id="aiText" class="text-xs">Tayyor...</p>
<button onclick="App.scan()" class="btn mt-2 w-full">Scan</button>
</div>

<!-- BOTTOM NAV -->

<div class="ui bottom-3 left-1/2 -translate-x-1/2 glass flex gap-5 px-6 py-2">
<div>🏠</div>
<div>🗺</div>
<div>❤️</div>
<div>👤</div>
</div>

<script>
let map, markers=[];
let coin=100;
let isSat=false;

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const places=[
 {type:"hotel",name:"Hotel",lat:41.31,lng:69.24,year:2024,reward:20},
 {type:"food",name:"Food",lat:41.312,lng:69.25,year:2024,reward:15},
 {type:"history",name:"History",lat:41.313,lng:69.23,year:1800,reward:30}
];

const App={

init(){
 map=L.map('map').setView([41.31,69.24],15);
 street.addTo(map);
 this.locate();
 this.updateCoin();
},

locate(){
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;

  map.setView([lat,lng],16);

  L.marker([lat,lng]).addTo(map)
   .bindPopup("Siz shu yerdasiz");

  L.circle([lat,lng],{radius:3000,color:'#00F3FF'}).addTo(map);

  this.showAll();
  this.getWeather(lat,lng);
 });
},

// WEATHER API
async getWeather(lat,lng){
 try{
  let url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`;
  let res=await fetch(url);
  let data=await res.json();

  document.getElementById("temp").innerText=data.current_weather.temperature+"°C";
  document.getElementById("wind").innerText=data.current_weather.windspeed+" km/h";

  let code=data.current_weather.weathercode;
  let desc="Clear";

  if(code>2) desc="Bulutli";
  if(code>60) desc="Yomg'ir";

  document.getElementById("desc").innerText=desc;

 }catch(e){
  console.log("Weather error",e);
 }
},

clear(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
},

showAll(){
 this.clear();
 places.forEach(p=>{
  let m=L.marker([p.lat,p.lng])
   .addTo(map)
   .bindPopup(p.name)
   .on('click',()=>this.addCoin(p.reward));
  markers.push(m);
 });
},

filter(type){
 this.clear();
 places.forEach(p=>{
  if(p.type===type){
   let m=L.marker([p.lat,p.lng])
    .addTo(map)
    .bindPopup(p.name)
    .on('click',()=>this.addCoin(p.reward));
   markers.push(m);
  }
 });
},

scan(){
 this.addCoin(10);
 this.speak("Bonus berildi");
},

addCoin(v){
 coin+=v;
 this.updateCoin();
},

updateCoin(){
 document.getElementById("coin").innerText=coin;
},

speak(t){
 let m=new SpeechSynthesisUtterance(t);
 m.lang="uz-UZ";
 speechSynthesis.speak(m);
}

};

App.init();
</script>

</body>
</html>
